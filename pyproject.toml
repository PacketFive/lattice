# SPDX-License-Identifier: GPL-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrixos-lattice"
dynamic = ["version"]
description = "Lattice, the PyrixOS package manager"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
authors = [{ name = "PacketFive" }]
keywords = ["package-manager", "reproducible-builds", "linux", "distribution", "pyrixos"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Software Distribution",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]
dependencies = [
  "cloche>=1.0,<2",
  "cryptography>=42",
  "pybonsai-lang>=1.0,<2",
  "pydantic>=2.6,<3",
]

[project.urls]
Homepage = "https://github.com/PacketFive/lattice"
Source = "https://github.com/PacketFive/lattice"
Issues = "https://github.com/PacketFive/lattice/issues"

[project.optional-dependencies]
# lattice config runs Trellis, the configuration command.
config = ["trellis-kconfig>=1.0,<2"]

[dependency-groups]
# Everything the quality gates need, installed with "pip install --group dev"
# (pip 25.1 or later). Groups are not part of the package metadata, so the
# pybootstrap name on PyPI, which belongs to an unrelated placeholder, can be
# replaced by its repository here.
dev = [
  "pybootstrap @ git+https://github.com/packetfive/pybootstrap.git",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
lattice = "lattice.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lattice.__version__" }

# The repository's src directory is the lattice package itself.
[tool.setuptools]
packages = ["lattice", "lattice.cache", "lattice.kmod", "lattice.profiles", "lattice.store"]
package-dir = { lattice = "src" }

# PEP 561 marker: the package ships its own type hints.
[tool.setuptools.package-data]
lattice = ["py.typed"]

# Quality gates, run with 'pybootstrap check'. Sources, line length and
# test paths are read from the tool tables below.
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
coverage-min = 80
coverage-package = "lattice"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests use assert, fixed test tokens and the openssl command, and test
# names describe themselves.
"tests/*" = ["S101", "S105", "S106", "S603", "S607", "D"]

# Tests import the installed package by name, since src/ has no
# lattice/ directory for ruff to discover it from.
[tool.ruff.lint.isort]
known-first-party = ["lattice"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=term-missing --import-mode=importlib"
markers = [
  "requires_userns: needs unprivileged user namespaces and a C compiler that links statically",
]
