# SPDX-License-Identifier: GPL-2.0

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrixos-lattice"
dynamic = ["version"]
description = "Lattice, the PyrixOS package manager"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "GPL-2.0-only" }
authors = [{ name = "PacketFive" }]
dependencies = ["pybonsai"]

[project.optional-dependencies]
# Everything the quality gates need. The pybootstrap name on PyPI belongs to
# an unrelated placeholder, so it is installed from its repository.
dev = [
  "pybootstrap @ git+https://github.com/packetfive/pybootstrap.git",
  "ruff>=0.4",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
]

[project.scripts]
lattice = "lattice.cli:main"

[tool.setuptools.dynamic]
version = { attr = "lattice.__version__" }

# The repository's src directory is the lattice package itself.
[tool.setuptools]
packages = ["lattice"]
package-dir = { lattice = "src" }

# PEP 561 marker: the package ships its own type hints.
[tool.setuptools.package-data]
lattice = ["py.typed"]

# Quality gates, run with 'pybootstrap check'. Sources, line length and
# test paths are read from the tool tables below.
[tool.pybootstrap]
gates = ["format", "lint", "typecheck", "test"]
# Raised to 80 at the end of Phase 1, once the function bodies exist.
coverage-min = 0
coverage-package = "lattice"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "S"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and test names describe themselves.
"tests/*" = ["S101", "D"]

# Tests import the installed package by name, since src/ has no
# lattice/ directory for ruff to discover it from.
[tool.ruff.lint.isort]
known-first-party = ["lattice"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
include = ["src", "tests"]
reportMissingImports = "error"
reportMissingTypeStubs = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov-report=term-missing --import-mode=importlib"
